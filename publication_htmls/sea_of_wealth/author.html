@keyframes sp { to { transform:rotate(360deg); } } @keyframes fi { to { opacity:1; } }

function u8(s) { return Uint8Array.from(atob(s), function(c) { return c.charCodeAt(0); }); }
function b64(a) { var s = ""; a = new Uint8Array(a); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function preloadStyles(html, done) {
  // warm the destination page's stylesheet(s) before swapping the document, so the real page does
  // not paint unstyled for a moment (owner bug report, 2026-11-09: a black nav-icon outline flashed
  // between the PIN screen and the site because the mobile tab-bar icons rendered before CSS applied)
  var hrefs = [], m, re = /<link[^>]+rel=["']stylesheet["'][^>]*href=["']([^"']+)["']/gi;
  while ((m = re.exec(html))) { hrefs.push(m[1]); }
  if (!hrefs.length) { done(); return; }
  var remaining = hrefs.length, finished = false;
  var finish = function() { if (finished) return; finished = true; done(); };
  setTimeout(finish, 1200);
  hrefs.forEach(function(href) {
    var l = document.createElement("link");
    l.rel = "preload"; l.as = "style"; l.href = href;
    l.onload = l.onerror = function() { remaining -= 1; if (remaining <= 0) finish(); };
    document.head.appendChild(l);
  });
}
function show(html) {

async function withKey(raw) {
