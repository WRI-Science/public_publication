.shake { animation:sh .35s; } @keyframes sh { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
#ph { display:none; position:fixed; inset:0; align-items:center; justify-content:center; }

@keyframes sp { to { transform:rotate(360deg); } } @keyframes fi { to { opacity:1; } }

function preloadStyles(html, done) {
  // warm the destination page's stylesheet(s) before swapping the document, so the real page does
  // not paint unstyled for a moment (owner bug report, 2026-11-09: a black nav-icon outline flashed
  // between the PIN screen and the site because the mobile tab-bar icons rendered before CSS applied)
  var hrefs = [], m, re = /<link[^>]+rel=["']stylesheet["'][^>]*href=["']([^"']+)["']/gi;
  while ((m = re.exec(html))) { hrefs.push(m[1]); }
  if (!hrefs.length) { done(); return; }
  var remaining = hrefs.length, finished = false;
  var finish = function() { if (finished) return; finished = true; done(); };
  setTimeout(finish, 1200);
  hrefs.forEach(function(href) {
    var l = document.createElement("link");
    l.rel = "preload"; l.as = "style"; l.href = href;
    l.onload = l.onerror = function() { remaining -= 1; if (remaining <= 0) finish(); };
    document.head.appendChild(l);
  });
}
function show(html) {

function lockForm() { document.documentElement.className = ""; try { document.getElementById("pin").focus({preventScroll: true}); } catch (e) {} }
async function withKey(raw) {
  var key = await crypto.subtle.importKey("raw", u8(raw), {name:"AES-GCM"}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(I)}, key, u8(C)));
}
async function gateOpen(pin) {
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(S), iterations:N, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(I)}, key, u8(C));
  var raw = b64(await crypto.subtle.exportKey("raw", key));
  try { sessionStorage.setItem("slp_key_v2", raw); sessionStorage.setItem("slp_pin", pin); } catch (e) {}
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", function(e) {
  e.preventDefault();
  gateOpen(document.getElementById("pin").value).then(show, function() {
    var f = document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    document.getElementById("err").textContent = "That PIN did not work.";
  });
});
(function() {
  var raw = null; try { raw = sessionStorage.getItem("slp_key_v2"); } catch (e) {}
  if (raw) { withKey(raw).then(show, function() { try { sessionStorage.removeItem("slp_key_v2"); } catch (e) {} lockForm(); }); }
  else { lockForm(); }
})();
})();
</script></body></html>
