    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(S), iterations:N, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(I)}, key, u8(C));
    try { sessionStorage.setItem("slp_pin", pin); } catch (e) {}
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) {
    if (!quiet) { var f = document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      document.getElementById("err").textContent = "That PIN did not work."; }
    return false;
  }
}
document.getElementById("f").addEventListener("submit", function(e) { e.preventDefault(); open_(document.getElementById("pin").value, false); });
(function() { var p = null; try { p = sessionStorage.getItem("slp_pin"); } catch (e) {} if (p) open_(p, true); })();
</script></body></html>
