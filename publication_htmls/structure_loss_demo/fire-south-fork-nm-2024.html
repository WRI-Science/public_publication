async function open_(pin, quiet) {
  try {
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(S), iterations:N, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
